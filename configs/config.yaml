# 应用基础配置
app:
  env: dev                     # 运行环境：loc(本地) / dev(开发) / prod(生产)

# 爬虫核心配置
crawler:
  target: ""   # 起始目标网站
  stages: # 爬取阶段配置
    first: # 初级阶段名 可自定义
      worker_count: 1                    # 并发工作协程数
      queue_size: 20                     # 任务队列缓冲大小
      delay: "5m"                       # 任务间隔延迟
      retry: # 重试策略
        max_attempts: 3                  # 最大重试次数
        backoff: "30s"                   # 重试退避间隔
    second: # 二级阶段名 可自定义
      worker_count: 3                    # 并发工作协程数
      queue_size: 500                    # 任务队列缓冲大小
      delay: "3m"                       # 任务间隔延迟
      retry:
        max_attempts: 3
        backoff: "30s"

# 浏览器自动化池配置
browser:
  enable: true                           # 是否启用浏览器池（false 则不创建 rod 浏览器实例）
  #只有catalog和detail video阶段需要浏览器抓取信息，唤起浏览器数量应大于等于三阶段worker_count之和以避免争抢
  pool_size: 3                           # 浏览器实例数量
  direct_pool_size: 0                    # 强制直连浏览器数量（不经过代理，>0 才会创建）
  max_idle_time: "5m"                    # 空闲浏览器最大存活时间
  headless: false                        # 是否无头模式（false 可见浏览器界面）
  disable_gpu: false                     # 禁用 GPU 加速
  no_sandbox: false                      # 禁用沙箱（容器环境可能需要）
  browser_path: ""  # Chrome 可执行文件路径 空置则调用默认Chromium
  headers: # 默认请求头
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
    Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"

# 静态 HTML 抓取客户端配置
html:
  enable: true                           # 是否启用静态 HTML 客户端
  timeout: "15s"                         # 请求超时
  max_body_size: 10485760                # 响应体大小上限（字节，10MB）
  headers: # 额外请求头
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
    Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"

# 代理管理器配置（未启用）
proxy:
  api_url: ""                              # 代理 API 地址（为空则不启用）
  refresh_interval: 500s                 # 代理列表刷新间隔

# 数据库配置
db:
  driver: "mysql"                        # 数据库驱动类型
  dsn: "root:123456@tcp(127.0.0.1:3306)/crawler?charset=utf8mb4&parseTime=True&loc=Local"  # 数据源名称
  max_idle_conns: 10                     # 最大空闲连接数
  max_open_conns: 100                    # 最大打开连接数
  conn_max_lifetime: 1h                  # 连接最大生命周期
  conn_max_idle_time: 10m                # 空闲连接最大存活时间

# 日志配置
log:
  dir: "./logs"                          # 日志输出目录
  max_size: 10                           # 单个日志文件最大大小（MB）
  max_days: 7                            # 保留旧日志文件的最大天数
  max_backups: 30                        # 保留的旧日志文件的最大数量
  compress: true                         # 日志文件是否应使用 gzip 压缩
  local_time: true                       # 本地时间

# 统一 HTTP 服务配置（监控页面）
server:
  enabled: true                          # 是否开启 HTTP 服务
  port: 9090                             # 监听端口
  monitor: true                          # 是否挂载监控页面/API（/monitor /api/monitor）

# 定时任务调度器配置 (可按业务自行增加或修改)
scheduler:
  enabled: true                          # 是否启用调度器
  timezone: "Asia/Shanghai"              # 时区（用于 cron 表达式）
  jobs: # 定时任务列表
    - name: "repeat_daily"              # 任务名称
      type: "repeat"                    # 任务类型：repeat（每日轮询新内容）
      schedule: "0 8 * * *"              # cron 表达式：每天 8:00 执行
    - name: "recover_tasks"              # 任务名称
      type: "recover"                    # 任务类型：recover（恢复超时未完成任务）
      schedule: "0 */6 * * *"            # cron 表达式：每 6 小时执行一次