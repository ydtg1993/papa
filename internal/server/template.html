<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papa Admin</title>
    <link rel="stylesheet" href="/static/mo.css">
</head>
<body>
<div id="login">
    <div class="box">
        <h1>PAPA ADMIN</h1>
        <p>输入访问密钥以登录监控后台</p>
        <input id="key" type="password" placeholder="访问密钥" autocomplete="off">
        <button class="btn" onclick="submitKey()">登录</button>
        <div class="err" id="err">密钥错误，请重试</div>
    </div>
</div>

<div class="shell" id="app">
    <aside class="sidebar">
        <div class="brand">Papa Admin</div>
        <nav>
            <div class="nav-section">Menu</div>
            <button class="nav-item active" data-module="dashboard" onclick="switchModule('dashboard')">Dashboard</button>
            <button class="nav-item" data-module="queue" onclick="switchModule('queue')">任务队列</button>
            <button class="nav-item" data-module="tasks" onclick="switchModule('tasks')">任务</button>
            <div class="nav-section">General</div>
            <button class="nav-item" data-module="data" onclick="switchModule('data')">数据浏览</button>
            <button class="nav-item" data-module="custom" onclick="switchModule('custom')">自定义数据</button>
            <button class="nav-item" data-module="settings" onclick="switchModule('settings')">设置</button>
        </nav>
        <button class="theme-toggle" id="theme-toggle">☾ 深色</button>
        <div class="side-status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
    </aside>

    <main class="content">
        <header class="content-top">
            <h1 id="moduleTitle">Dashboard</h1>
            <div class="refresh" id="refreshTime"></div>
        </header>

        <div class="module active" id="mod-dashboard">
            <section>
                <h2>系统负载</h2>
                <div class="grid" id="dash-sys"></div>
            </section>
            <section>
                <h2>业务目录占用</h2>
                <div class="grid" id="dash-dirs"></div>
            </section>
            <section>
                <h2>任务队列概览</h2>
                <div id="dash-queue"></div>
            </section>
        </div>

        <div class="module" id="mod-queue">
            <section>
                <h2>各阶段队列详情</h2>
                <div id="queue-stages"></div>
            </section>
        </div>

        <div class="module" id="mod-tasks">
            <section>
                <h2>任务明细</h2>
                <div class="card">
                    <div class="toolbar">
                        <select id="task-stage" onchange="DataBrowser.page=1;loadTasks()"><option value="">全部阶段</option></select>
                        <select id="task-status" onchange="DataBrowser.page=1;loadTasks()">
                            <option value="">全部状态</option>
                            <option value="0">待处理</option>
                            <option value="1">处理中</option>
                            <option value="2">成功</option>
                            <option value="3">失败</option>
                        </select>
                        <input id="task-search" placeholder="搜索 URL / 标题" onkeydown="if(event.key==='Enter'){DataBrowser.page=1;loadTasks();}">
                        <button class="btn" style="margin-top:0" onclick="DataBrowser.page=1;loadTasks()">查询</button>
                    </div>
                    <div class="table-wrap" id="task-table"></div>
                    <div class="pager" id="task-pager"></div>
                </div>
            </section>
        </div>

        <div class="module" id="mod-data">
            <section>
                <h2>数据浏览</h2>
                <div class="card">
                    <div class="toolbar">
                        <select id="data-model-select" onchange="onDataModelChange()"></select>
                        <input id="data-search" placeholder="搜索（模糊匹配字符串列）" onkeydown="if(event.key==='Enter'){DataBrowser.page=1;loadDataBrowser();}">
                        <button class="btn" style="margin-top:0" onclick="DataBrowser.page=1;loadDataBrowser()">查询</button>
                    </div>
                    <div class="filters" id="data-filters"></div>
                    <div class="table-wrap" id="data-table"></div>
                    <div class="pager" id="data-pager"></div>
                </div>
            </section>
        </div>

        <div class="module" id="mod-custom">
            <section>
                <h2>自定义数据</h2>
                <div class="kv" id="custom"></div>
            </section>
        </div>

        <div class="module" id="mod-settings">
            <section>
                <h2>白名单</h2>
                <div class="card">
                    <p class="hint">每行一个 IP 或 CIDR，保存后立即生效（留空 = 不限制）。</p>
                    <p class="hint" id="wl-file-info"></p>
                    <textarea id="wl-input" rows="5" placeholder="127.0.0.1&#10;10.0.0.0/8"></textarea>
                    <button class="btn" onclick="saveWhitelist()">保存白名单</button>
                    <div class="hint" id="wl-msg"></div>
                </div>
            </section>
            <section>
                <h2>登录密钥</h2>
                <div class="card">
                    <p class="hint" id="secret-file-info"></p>
                    <button class="btn danger" onclick="regenSecret()">重新生成密钥</button>
                    <div class="secret-box hidden" id="secret-result"></div>
                </div>
            </section>
            <section>
                <h2>日志导出</h2>
                <div class="card">
                    <button class="btn" onclick="downloadLogs()">全部打包下载</button>
                    <div class="log-list" id="log-list"></div>
                </div>
            </section>
            <section>
                <h2>爬虫控制</h2>
                <div class="card">
                    <button class="btn danger" onclick="doShutdown()">优雅退出</button>
                    <div class="hint" id="shutdown-msg"></div>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="/static/mo.js"></script>
</body>
</html>
