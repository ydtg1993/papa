# 本地开发数据库：docker compose up -d 一键启动 MySQL
# 与 configs/config.yaml 的 db.dsn 对应（root:123456@tcp(127.0.0.1:3306)/crawler）
version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: crawler
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

volumes:
  mysql_data:
